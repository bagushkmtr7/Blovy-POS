name: Build Blovy POS & SIS APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build BLOVY POS APK
        run: flutter build apk --release --flavor pos -t lib/main_pos.dart
      - name: Save BLOVY POS APK
        run: cp build/app/outputs/flutter-apk/app-pos-release.apk blovy-pos.apk
      - name: Build BLOVY SIS APK
        run: flutter build apk --release --flavor sis -t lib/main_sis.dart
      - name: Save BLOVY SIS APK
        run: cp build/app/outputs/flutter-apk/app-sis-release.apk blovy-sis.apk
      - name: Upload BLOVY POS APK
        uses: actions/upload-artifact@v4
        with:
          name: blovy-pos-apk
          path: blovy-pos.apk
      - name: Upload BLOVY SIS APK
        uses: actions/upload-artifact@v4
        with:
          name: blovy-sis-apk
          path: blovy-sis.apk
